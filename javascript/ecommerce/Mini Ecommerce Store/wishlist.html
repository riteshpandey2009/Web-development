<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store - Wishlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans antialiased">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="container mx-auto px-4 h-16 flex items-center justify-between gap-4">

      <a href="index.html" class="flex items-center gap-2 text-xl font-bold tracking-tight text-slate-900 shrink-0">
        <svg class="w-6 h-6 text-teal-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
        </svg>
        <span>Store</span>
      </a>

      <nav class="flex items-center gap-5 text-sm font-medium shrink-0">
        <a href="index.html" class="text-slate-600 hover:text-teal-700 transition">Home</a>
        <a href="wishlist.html"
          class="text-teal-700 font-semibold hover:text-teal-800 transition flex items-center gap-1.5">
          <span>Wishlist</span>
          <span id="wishlist-count"
            class="inline-flex items-center justify-center px-2 py-0.5 text-xs font-semibold text-white bg-teal-700 rounded-full">2</span>
        </a>
        <a href="cart.html" class="text-slate-600 hover:text-teal-700 transition flex items-center gap-1.5">
          <span>Cart</span>
          <span id="cart-count"
            class="inline-flex items-center justify-center px-2 py-0.5 text-xs font-semibold text-white bg-teal-700 rounded-full">3</span>
        </a>
      </nav>

    </div>
  </header>

  <main class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
    <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-6">My Wishlist</h1>

    <div id="wishlist-container">

      <!-- <div class="bg-white border border-slate-200 rounded-lg divide-y divide-slate-200 overflow-hidden shadow-sm"> -->

      <!-- </div> -->


      <div class="bg-white border border-slate-200 rounded-lg p-12 text-center max-w-md mx-auto my-8">
        <div class="w-16 h-16 mx-auto mb-4 text-slate-300 flex items-center justify-center">
          <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z">
            </path>
          </svg>
        </div>
        <h2 class="text-xl font-semibold text-slate-800 mb-2">Your wishlist is empty</h2>
        <p class="text-slate-500 text-sm mb-6">Looks like you haven't saved any products to your wishlist yet.</p>
        <a href="index.html"
          class="inline-flex items-center justify-center bg-teal-700 hover:bg-teal-800 text-white font-medium px-6 py-2.5 rounded-md transition text-sm">
          Start Shopping
        </a>
      </div>


    </div>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
    <div class="container mx-auto px-4 text-center text-sm text-slate-500">
      <p>© 2026 Store. All rights reserved.</p>
    </div>
  </footer>



  <script src="js/main.js"></script>
</body>

</html>
