<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>Hello dosto</h1>

    <form action="" id="form">
        <div>
            <label for="username">Name :</label>
            <input value="" type="text" id="username" placeholder="Enter your name">
            <span id="error-message"></span>
        </div>


        <div>
            <label for="mail">Email :</label>
            <input type="email" id="mail" placeholder="Enter your email">
            <span class="error-message"></span>
        </div>

        <div>
            <label for="pass">Password :</label>
            <input type="password" id="pass" placeholder="Enter your password">
            <span class="error-message"></span>
        </div>

        <p id="passwordHint" class="hidden">Must be atlest 8 character</p>

        <div>
            <label for="bio">Textarea :</label>
            <textarea name="" id="bio" placeholder="Enter your bio"></textarea>
            <span class="error-message"></span>
            <p id="character-count"></p>
        </div>

        <div>
            <label for="country">Select your country :</label>
            <select name="" id="country">
                <option value="india">India</option>
                <option value="usa">Usa</option>
                <option value="uk">Uk</option>
            </select>
            <span class="error-message"></span>
        </div>


        <div>
            <input type="checkbox" id="checkbox">
            <label for="checkbox">I agree to the terms & condition </label>
        </div>




        <button type="submit" id="btn">Login</button>

    </form>
    <script src="index.js"></script>
</body>

</html>
