<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Forms</h1>
    
    <div>
        <form action="welcomePage.html" target="_blank">
            <fieldset>
                <legend>Enter your basic information</legend>
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" placeholder="Enter your name" required>

                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <br><br>
                <label for="checkbox">Are you 18+ ??:</label>
                <input type="checkbox" id="checkbox" required>

                <br><br>
                <label for="phoneNumber">Enter your phone number:</label>
                <input type="number" id="phoneNumber" placeholder="Enter your mobile number" required maxlength="10">

                <br><br>
                <label for="gender">Gender:</label>
                <label for="Male">Male</label>
                <input type="radio" id="Male" name="gender" required>
                <label for="Female">Female</label>
                <input type="radio" id="Female" name="gender" required>

                <br><br>
                <label for="DOB">Enter your DOB : </label>
                <input type="Date" id="DOB" required>

                <br><br>
                <label for="file">Upload Photo : </label>
                <input type="file" id="file" required>

                <br><br>
                <label for="city">Select your city : </label>
                <select name="city" id="city" required>

                    <option value="delhi">Delhi</option>
                    <option value="agra">Agra</option>
                    <option value="almora">Almora</option>
                    <option value="pune">Pune</option>
                    <option value="bareilly" selected>Bareilly</option>
                    <option value="noida">Noida</option>
                    <option value="mumbai">Mumbai</option>
                </select>

                <br><br>
                <button type="submit"> Submit Form</button>
            </fieldset>
        </form>
    </div>
</body>

</html>
