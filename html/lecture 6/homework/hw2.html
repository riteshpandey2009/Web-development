<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="syle.css">
</head>

<body>
    <div>
        <h1>Pete's Pizza Delivery</h1>
        <h2>Online Order Form</h2>
        <p>*required feilds</p>

    <form action="">
        <fieldset>
            <legend>Customer Details</legend>
            <table>
                <tr>
                    <td> <label for="name"><b>*</b>Name :</label></td>
                    <td><input type="text" id="name" required></td>
                </tr>
                <tr>
                    <td><label for="add"><b>*</b>Address :</label></td>
                    <td><input type="text" id="add" required></td>
                </tr>
                <tr>
                    <td><label for="city"><b>*</b>Town/City :</label></td>
                    <td><input type="text" id="city" required></td>
                </tr>
                <tr>
                    <td> <label for="post"><b>*</b>Postcode :</label></td>
                    <td><input type="number" id="post" min="6" required></td>
                </tr>
                <tr>
                    <td><label for="phone"><b>*</b>Tel :</label>
                </td>
                    <td><input type="number" id="phone" min="10" required></td>
                </tr>
                <tr>
                    <td><label for="mail"><b>*</b>Email :</label></td>
                    <td><input type="email" id="mail" required></td>
                </tr>
            </table>
        </fieldset>


        <table id="field">
            <tr>
                <td><fieldset>
                <legend>Topping*</legend>

                <input type="radio" id="top" name="top" required>
                <label for="top">Margherita</label>


                <br>
                <input type="radio" id="four" name="top" required>
                <label for="four">Four Seasons</label>


                <br>
                <input type="radio" id="meat" name="top" required>
                <label for="meat">Meat Feast</label>

            </fieldset></td>
                <td> <fieldset>
                <legend>Size*</legend>

                <input type="radio" id="small" name="size" required>
                <label for="small">Small</label>


                <br>
                <input type="radio" id="mid" name="size" required>
                <label for="mid">Meadium</label>


                <br>
                <input type="radio" id="large" name="size" required>
                <label for="large">Large</label>

            </fieldset></td>
                <td><fieldset>
                <legend>Extras*</legend>

                <input type="checkbox" id="mush" required>
                <label for="mush">Mushrooms</label>


                <br>
                <input type="checkbox" id="green" required>
                <label for="green">Green peppers</label>


                <br>
                <input type="checkbox" id="anch" required>
                <label for="anch">Anchovies</label>


                <br>
                <input type="checkbox" id="extra" required>
                <label for="extra">Extra cheese</label>

            </fieldset></td>
            </tr>

</table>

    
            <fieldset>
                <legend>Delivery</legend>
                <label for="delivery">Preferred delivery time: </label>
                <input type="time" id="delivery" required>
                <br><br>
                <label for="ins">Delivery Instructions:</label>
                <br>
                <textarea id="ins" rows="5" cols="40" placeholder="Type your instructions here..."></textarea>

            </fieldset>
            <br><br>
            <button>Submit order</button>
</form>
</div>
</body>

</html>
