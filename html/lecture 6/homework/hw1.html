<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>
        Novell Services Login
    </h1>

    <!-- Simple form -->
    <form action="">
        <label for="name">Username :</label>
        <input type="text" id="name" placeholder="Enter your Username">


        <br><br>


        <label for="pass">Password :</label>
        <input type="password" id="pass" placeholder="Enter your Password">


        <br><br>


        <label for="city">City </label>
        <br>
        <label for="city"> of employment : </label>
        <input type="text" id="city" placeholder="Enter your Password" maxlength="8">

        <br><br>
        <label for="web">Web Server :</label>
        <select name="web" id="web">
            <option value="">-Choose a Server-</option>
            <option value="">Static Web Server</option>
            <option value="">Dynamic Web Server</option>

        </select>


        <br><br>


        <label for="role">Please specify </label>
        <br>
        <label for="role"> your role : </label>
        <br>
        <input type="radio" id="admin" name="role" required>
        <label for="admin">Admin</label>


        <br><br>
        <input type="radio" id="eng" name="role" required>
        <label for="eng">Engineer</label>

        <br><br>
        <input type="radio" id="man" name="role" required>
        <label for="man">Manager</label>

        <br><br>
        <input type="radio" id="guest" name="role" required>
        <label for="guest">Guest</label>

        <br><br>
        <label for="checkbox">Single Sign-on </label>

        <br>
        <label for="checkbox" name="check"> to the follwing : </label>

        <br>
        <input type="checkbox" id="mail" name="mail">
        <label for="mail"> Mail </label>

        <br>
        <input type="checkbox" id="pay" name="pay">
        <label for="pay"> Payroll </label>

        <br>
        <input type="checkbox" id="self" name="self">
        <label for="self"> Self- Service </label>

        <br><br>
        <button>Login</button>
        <button>Reset</button>
    </form>

    <!-- using table -->
    <br><br><br>
    <h2>Form using table tag</h2>

    <form action="">
        <table>
            <tr>
                <td> <label for="name">Username :</label></td>
                <td> <input type="text" id="name" placeholder="Enter your Username"></td>
            </tr>
            <tr>
                <td><label for="pass">Password :</label></td>
                <td> <input type="password" id="pass" placeholder="Enter your Password"></td>
            </tr>
            <tr>
                <td><label for="city">City of employment :</label></td>
                <td><input type="text" id="city" placeholder="Enter your Password" maxlength="8"></td>
            </tr>
            <tr>
                <td> <label for="web">Web Server :</label></td>
                <td> <select name="web" id="web">
                        <option value="">-Choose a Server-</option>
                        <option value="">Static Web Server</option>
                        <option value="">Dynamic Web Server</option>

                    </select></td>
            </tr>
            <tr>
                <td> <label for="role">Please specify your role: </label></td>
                <td> <input type="radio" id="admin" name="role" required>
                    <label for="admin">Admin</label>


                    <br>
                    <input type="radio" id="eng" name="role" required>
                    <label for="eng">Engineer</label>

                    <br>
                    <input type="radio" id="man" name="role" required>
                    <label for="man">Manager</label>

                    <br>
                    <input type="radio" id="guest" name="role" required>
                    <label for="guest">Guest</label>
                </td>
            </tr>
            <tr>
                <td><label for="checkbox">Single Sign-on </label></td>
                <td> <label for="checkbox" name="check"> to the follwing : </label>

                    <br>
                    <input type="checkbox" id="mail" name="mail">
                    <label for="mail"> Mail </label>

                    <br>
                    <input type="checkbox" id="pay" name="pay">
                    <label for="pay"> Payroll </label>

                    <br>
                    <input type="checkbox" id="self" name="self">
                    <label for="self"> Self- Service </label>
                </td>
            </tr>
            <tr>
                <th colspan="1"> <button>Login</button>
                    <button>Reset</button>
                </th>
            </tr>
        </table>
    </form>



</body>

</html>
